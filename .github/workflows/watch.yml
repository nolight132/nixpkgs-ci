name: Watch nixpkgs

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-nixpkgs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: NixOS/nixpkgs
      PR_AUTHOR: nolight132

    steps:
      - name: Poll
        shell: bash
        run: |
          set -euo pipefail

          open_prs="$(
            gh pr list \
              --repo "$UPSTREAM_REPO" \
              --author "$PR_AUTHOR" \
              --base master \
              --state open \
              --limit 200 \
              --json number,headRefOid \
              --jq 'sort_by(.number)[] | [.number, .headRefOid] | @tsv'
          )"

          build_runs="$(mktemp)"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs[].display_title' \
            > "$build_runs"

          while IFS=$'\t' read -r pr sha; do
            [[ -z "${pr:-}" ]] && continue

            title="PR #${pr} @ ${sha}"

            if grep -Fxq "$title" "$build_runs"; then
              continue
            fi

            gh workflow run build.yml \
              --repo "$GITHUB_REPOSITORY" \
              -f pr="$pr" \
              -f sha="$sha"

            echo "$title" >> "$build_runs"
          done <<< "$open_prs"

          unstable_sha="$(
            gh api \
              "repos/${UPSTREAM_REPO}/git/ref/heads/nixos-unstable" \
              --jq '.object.sha'
          )"

          state="$(
            printf '%s\n%s\n' "$unstable_sha" "$open_prs" \
              | sha256sum \
              | cut -d' ' -f1
          )"

          personal_title="personal @ ${state}"
          personal_runs="$(mktemp)"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/personal.yml/runs?per_page=100" \
            --jq '.workflow_runs[].display_title' \
            > "$personal_runs"

          if ! grep -Fxq "$personal_title" "$personal_runs"; then
            gh workflow run personal.yml \
              --repo "$GITHUB_REPOSITORY" \
              -f state="$state"
          fi
