name: Watch nixpkgs

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-nixpkgs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: NixOS/nixpkgs
      PR_AUTHOR: nolight132

    steps:
      - name: Poll
        shell: bash
        run: |
          set -euo pipefail

          prs="$(
            gh pr list \
              --repo "$UPSTREAM_REPO" \
              --author "$PR_AUTHOR" \
              --base master \
              --state open \
              --limit 200 \
              --json number,headRefOid \
              --jq 'sort_by(.number) | map("\(.number):\(.headRefOid)") | join(",")'
          )"

          unstable_sha="$(
            gh api \
              "repos/${UPSTREAM_REPO}/git/ref/heads/nixos-unstable" \
              --jq '.object.sha'
          )"

          state="$(
            printf '%s\n%s\n%s\n' "$GITHUB_SHA" "$unstable_sha" "$prs" \
              | sha256sum \
              | cut -d' ' -f1
          )"

          echo "unstable: $unstable_sha"
          echo "open prs: ${prs:-none}"
          echo "state:    $state"

          personal_title="personal @ ${state}"
          personal_runs="$(mktemp)"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/personal.yml/runs?per_page=100" \
            --jq '.workflow_runs[].display_title' \
            > "$personal_runs"

          if grep -Fxq "$personal_title" "$personal_runs"; then
            echo "already composed, nothing to do"
            exit 0
          fi

          gh workflow run personal.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f state="$state" \
            -f prs="$prs"
