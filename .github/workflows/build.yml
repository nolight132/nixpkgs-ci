name: Build nixpkgs PR
run-name: "PR #${{ inputs.pr }} @ ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: nixpkgs PR number
        required: true
        type: string
      sha:
        description: Expected PR head SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: nixpkgs-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: NixOS/nixpkgs
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}

    steps:
      - name: Read PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(
            gh api "repos/${UPSTREAM_REPO}/pulls/${PR}"
          )"

          current_sha="$(
            jq -r '.head.sha' <<< "$pr_json"
          )"

          if [[ "$current_sha" != "$SHA" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(
            jq -r '.base.sha' <<< "$pr_json"
          )"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout nixos-unstable
        if: steps.pr.outputs.stale != 'true'
        uses: actions/checkout@v6
        with:
          repository: NixOS/nixpkgs
          ref: nixos-unstable
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install Nix
        if: steps.pr.outputs.stale != 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix
        if: steps.pr.outputs.stale != 'true'
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-nolight
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install nixpkgs-review
        if: steps.pr.outputs.stale != 'true'
        run: nix profile add .#nixpkgs-review

      - name: Apply PR
        id: apply
        if: steps.pr.outputs.stale != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail

          git config user.name "nixpkgs-ci"
          git config user.email "nixpkgs-ci@users.noreply.github.com"

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin "+refs/pull/${PR}/head:refs/pr/${PR}"

          if [[ "$(git rev-parse "refs/pr/${PR}")" != "$SHA" ]]; then
            echo "stale head after fetch" >&2
            exit 1
          fi

          patch="$RUNNER_TEMP/pr-${PR}.diff"

          git diff \
            --binary \
            "${BASE_SHA}...${SHA}" \
            > "$patch"

          if [[ ! -s "$patch" ]] || git apply --reverse --check "$patch" >/dev/null 2>&1; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply --3way --index "$patch"
          git commit -m "Apply NixOS/nixpkgs#${PR}"

          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Build PR
        if: steps.apply.outputs.applied == 'true'
        run: |
          nixpkgs-review rev \
            --branch nixos-unstable \
            --no-shell \
            --print-result \
            HEAD

      - name: Refresh watcher
        if: steps.pr.outputs.stale != 'true'
        run: |
          gh workflow run watch.yml \
            --repo "$GITHUB_REPOSITORY"
